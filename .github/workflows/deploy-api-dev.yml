name: Deploy API Development - Money Flow

on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git log -1 --pretty=format:%h)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=format:%an)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: |
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/money-flow-api-dev:latest ./apps/api
          docker push ${{ secrets.DOCKER_USERNAME }}/money-flow-api-dev:latest
          
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
            cd /home/ops/development/money-flow/api
            docker compose pull
            docker compose down
            docker compose up -d
          EOF